import org.gradle.api.file.DirectoryProperty
import org.gradle.api.provider.ListProperty
import org.gradle.api.provider.ValueSource
import org.gradle.api.provider.ValueSourceParameters

apply plugin: 'com.android.application'
// AGP 9 compiles Kotlin itself (built-in Kotlin). Applying kotlin-android
// alongside it fails with "Cannot add extension with name 'kotlin'".

// Release signing is optional and never committed. Put the keystore path and
// passwords in android/keystore.properties (gitignored), or leave it absent to
// build an unsigned release for inspection. Debug builds do not use this.
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('keystore.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

// The version is deliberately not derived from git: Android refuses an APK
// whose versionCode is lower than the installed one, so the code is a checked-in
// high-water mark in android/version.properties and is bumped for each release.
// The name is the nearest tag (without its `v`). The Makefile and the android
// workflow pass both explicitly; these fallbacks keep a direct `gradlew`
// invocation honest.
def versionProperties = new Properties()
def versionPropertiesFile = rootProject.file('version.properties')
if (versionPropertiesFile.exists()) {
    versionPropertiesFile.withInputStream { versionProperties.load(it) }
}
// Gradle 9.9 deprecates starting a process at configuration time and points at
// ValueSource for values the configuration genuinely needs.
abstract class GitDescribe implements ValueSource<String, GitDescribe.Parameters> {
    interface Parameters extends ValueSourceParameters {
        ListProperty<String> getArgs()
        DirectoryProperty getDirectory()
    }

    @Override
    String obtain() {
        try {
            def process = new ProcessBuilder(['git'] + parameters.args.get())
                .directory(parameters.getDirectory().get().asFile)
                .redirectErrorStream(true)
                .start()
            def text = process.inputStream.text.trim()
            process.waitFor()
            return text
        } catch (Exception ignored) {
            return ''
        }
    }
}

def gitValue = { String... args ->
    try {
        providers.of(GitDescribe) {
            parameters.args.set(args.toList())
            parameters.directory.set(rootProject.layout.projectDirectory)
        }.get().trim()
    } catch (Exception ignored) {
        ''
    }
}
def described = gitValue('describe', '--tags', '--always', '--dirty')
def defaultVersionName = described ? described.replaceFirst('^v', '') : '0.1.0-dev'
def defaultVersionCode = versionProperties.getProperty('versionCode', '1')

android {
    namespace = 'dev.darkfactory.mobile'
    compileSdk = 36

    defaultConfig {
        applicationId = 'dev.darkfactory.mobile'
        minSdk = 26
        targetSdk = 36
        testInstrumentationRunner = 'android.test.InstrumentationTestRunner'
        def resolvedCode = (findProperty('dfVersionCode') ?: defaultVersionCode).toString().toInteger()
        def resolvedName = findProperty('dfVersionName') ?: defaultVersionName
        versionCode = resolvedCode
        versionName = resolvedName
    }

    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            if (keystorePropertiesFile.exists()) {
                signingConfig = signingConfigs.release
            }
            minifyEnabled = false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError = true
        checkReleaseBuilds = false
    }
}

// Built-in Kotlin sets the Kotlin jvmTarget from targetCompatibility, so the
// Java options above are the single bytecode target.
dependencies {
    implementation 'org.bouncycastle:bcprov-jdk18on:1.86'
    // AGP 9 removed the android.sdkDirectory property; ask the SDK components
    // provider instead. The platform test jars are still shipped in SDK 36.
    def testJars = androidComponents.sdkComponents.sdkDirectory.map { sdkDir ->
        ['base', 'runner', 'mock'].collect { name ->
            sdkDir.file("platforms/android-${android.compileSdk}/optional/android.test.${name}.jar")
        }
    }
    androidTestCompileOnly files(testJars)
}

// The daemon and the Android client render the same UI. Copy it at build time
// instead of committing a second copy that can drift from web/.
def webSource = rootProject.file('../web')
def webGenerated = layout.buildDirectory.dir('generated/webAssets')
def webDestination = layout.buildDirectory.dir('generated/webAssets/web')

tasks.register('syncWebAssets', Sync) {
    from(webSource) {
        exclude 'embed.go'
        exclude '**/.DS_Store'
    }
    into(webDestination)
}

android.sourceSets.main.assets.srcDirs += [webGenerated.get().asFile]
tasks.named('preBuild').configure {
    dependsOn 'syncWebAssets'
    dependsOn 'verifyBouncyCastleArtifact'
}

tasks.register('verifyBouncyCastleArtifact') {
    doLast {
        def packages = new TreeMap()
        ['debugRuntimeClasspath', 'releaseRuntimeClasspath'].each { configurationName ->
            def artifacts = configurations.getByName(configurationName).resolvedConfiguration.resolvedArtifacts
            artifacts.each { artifact ->
                def id = artifact.moduleVersion.id
                packages["${id.group}:${artifact.name}:${id.version}".toString()] = [
                    package: [ecosystem: 'Maven', name: "${id.group}:${artifact.name}".toString()],
                    version: id.version
                ]
            }
            def providers = artifacts.findAll {
                it.moduleVersion.id.group == 'org.bouncycastle' && it.name == 'bcprov-jdk18on'
            }
            if (providers.size() != 1 || providers[0].moduleVersion.id.version != '1.86') {
                throw new GradleException("Expected exactly the pinned Bouncy Castle 1.86 provider in ${configurationName}")
            }
            def sha256 = java.security.MessageDigest.getInstance('SHA-256')
                .digest(providers[0].file.bytes)
                .collect { String.format('%02x', it & 0xff) }
                .join()
            if (sha256 != '2af190b300cbb0b35e248ccf5f4a06b6072030aeb3da7a98ec73abe5b4cb371f') {
                throw new GradleException("Bouncy Castle provider SHA-256 mismatch in ${configurationName}")
            }
        }
        def report = layout.buildDirectory.file('reports/security-runtime-dependencies.json').get().asFile
        report.parentFile.mkdirs()
        report.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(packages.values()))
    }
}
