name: vuln

# govulncheck asks whether this code can *reach* an advisory, not whether a
# pinned version merely matches one. It needs the vulnerability database, so it
# is not part of `make check`; weekly is enough to notice a new one.
on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - name: scan
        run: make vuln
