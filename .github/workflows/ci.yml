name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: vet, test, race, ui
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # `make check` includes desktop-check, and the desktop module is cgo with
      # GTK4/WebKitGTK/VTE. The runner image does not carry the dev headers.
      - name: desktop headers
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-4-dev libwebkitgtk-6.0-dev libvte-2.91-gtk4-dev libsoup-3.0-dev

      # Ubuntu 24.04 restricts unprivileged user namespaces, which bwrap needs.
      # Without this the jail test skips; with it, CI proves the mask.
      - name: unprivileged user namespaces
        run: |
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi

      # Dependencies are vendored and tracked; a go.mod edit without the vendor
      # tree is a broken build for anyone offline.
      - name: dependencies are tidy and vendored
        run: |
          go mod tidy -diff
          go mod verify
          go build -mod=vendor ./...

      - name: make check
        run: make check

      - name: the shipped binary is static
        run: |
          make build
          file bin/darkfactory
          if file bin/darkfactory | grep -q 'dynamically linked'; then
            echo "bin/darkfactory is not static" >&2
            exit 1
          fi
          ./bin/darkfactory version

  # The UI gate is the shared client contract. It drives the real page at
  # 1280x900 and 396x719, so it needs Chromium and a PTY. The static half of
  # the gate already ran in `make check`; this job proves the served bytes and
  # the layout.
  ui-gate:
    name: ui gate (browser)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: install the dev-only browser client
        working-directory: tools/clientbench
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: make ui-gate
        run: make ui-gate

  # Cross-compiling is the cheapest portability test there is: it catches a
  # stray syscall before someone tries to install the result. Windows is not in
  # the matrix on purpose: internal/session needs a POSIX PTY and does not build
  # there yet.
  build:
    name: build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: CGO_ENABLED=0 go build -trimpath -o /dev/null ./cmd/darkfactory

  dist:
    name: release artifacts
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: make dist
        run: make dist VERSION=0.0.0-ci

      - name: checksums verify
        run: cd dist && sha256sum -c SHA256SUMS

      # Two builds from one commit must produce the same bytes; the release
      # target claims that (NF-REL-6) and this is where the claim is kept.
      - name: artifacts are reproducible
        run: |
          cp dist/SHA256SUMS /tmp/first
          make dist VERSION=0.0.0-ci >/dev/null
          diff /tmp/first dist/SHA256SUMS

      - name: inspect the packages
        run: |
          dpkg-deb -I dist/darkfactory_0.0.0-ci_amd64.deb
          dpkg-deb -c dist/darkfactory_0.0.0-ci_amd64.deb
          tar tzf dist/darkfactory_linux_amd64.tar.gz

      - uses: actions/upload-artifact@v7
        with:
          name: darkfactory-dist
          path: dist/
          if-no-files-found: error
